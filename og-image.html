<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#080c14;
    font-family:'Syne',sans-serif;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  /* background glow blobs */
  .blob1{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(230,0,126,0.25),transparent 70%);top:-100px;left:-100px}
  .blob2{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(155,0,245,0.2),transparent 70%);bottom:-80px;right:100px}
  .blob3{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(230,0,126,0.1),transparent 70%);top:50px;right:300px}
  /* grid lines */
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:60px 60px}
  .inner{position:relative;z-index:2;display:flex;align-items:center;gap:80px;padding:60px}
  /* left side */
  .left{flex:1}
  .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(230,0,126,0.12);border:1px solid rgba(230,0,126,0.3);border-radius:30px;padding:6px 18px;margin-bottom:28px}
  .badge-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e}
  .badge span{color:#22c55e;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  h1{font-size:72px;font-weight:900;line-height:1.05;color:#fff;letter-spacing:-2px;margin-bottom:20px}
  h1 em{font-style:normal;background:linear-gradient(135deg,#e6007e,#ff4daa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:22px;color:#7a8fa6;font-weight:400;line-height:1.5;max-width:520px}
  .sub strong{color:#f0f4f8}
  /* right side — stats panel */
  .panel{background:rgba(15,22,35,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:36px 40px;min-width:280px;backdrop-filter:blur(20px)}
  .panel-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7a8fa6;margin-bottom:24px}
  .stat{margin-bottom:20px}
  .stat-num{font-size:48px;font-weight:900;line-height:1;background:linear-gradient(135deg,#e6007e,#ff4daa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat-label{font-size:13px;color:#7a8fa6;margin-top:4px;font-weight:500}
  .divider{height:1px;background:rgba(255,255,255,0.06);margin:20px 0}
  .stat-row{display:flex;gap:32px}
  .stat-sm .stat-num{font-size:32px}
  /* logo bottom */
  .logo-bar{position:absolute;bottom:36px;left:60px;display:flex;align-items:center;gap:12px;z-index:2}
  .logo-dot{width:12px;height:12px;background:#e6007e;border-radius:50%;box-shadow:0 0 16px #e6007e}
  .logo-text{font-size:22px;font-weight:900;color:#fff;letter-spacing:-0.5px}
  .logo-pro{font-size:10px;font-weight:700;letter-spacing:1.5px;background:linear-gradient(135deg,#e6007e,#9b00f5);color:#fff;padding:2px 10px;border-radius:20px;text-transform:uppercase}
  .url{position:absolute;bottom:42px;right:60px;font-size:14px;color:rgba(255,255,255,0.25);z-index:2;letter-spacing:0.5px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="grid"></div>

  <div class="inner">
    <div class="left">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>Live Predictions</span>
      </div>
      <h1>Win More.<br><em>Every Day.</em></h1>
      <p class="sub">Expert football tips curated daily.<br><strong>Free picks + Pro selections</strong> — updated live.</p>
    </div>
    <div class="panel">
      <div class="panel-title">Today's Stats</div>
      <div class="stat">
        <div class="stat-num">85%</div>
        <div class="stat-label">Average Win Rate</div>
      </div>
      <div class="divider"></div>
      <div class="stat-row">
        <div class="stat stat-sm">
          <div class="stat-num">10+</div>
          <div class="stat-label">Daily Tips</div>
        </div>
        <div class="stat stat-sm">
          <div class="stat-num">⚽</div>
          <div class="stat-label">All Leagues</div>
        </div>
      </div>
    </div>
  </div>

  <div class="logo-bar">
    <div class="logo-dot"></div>
    <span class="logo-text">Bett Officials</span>
    <span class="logo-pro">Pro</span>
  </div>
  <div class="url">pro-prediction.bett.website</div>
</body>
</html>
